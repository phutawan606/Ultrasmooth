<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เพิ่มอุปกรณ์ - Warranty Guard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-6">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-lg font-semibold text-slate-800">เพิ่มอุปกรณ์ใหม่</h1>
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-800">กลับหน้าหลัก</a>
    </div>

    <form id="add-form" onsubmit="saveEquipment(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่ออุปกรณ์ *</label>
        <input type="text" id="name" required placeholder="เช่น iPhone 15 Pro, จอมอนิเตอร์ Dell" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-blue-500">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">ยี่ห้อ (Brand)</label>
          <input type="text" id="brand" placeholder="Apple, Dell, Sony" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">หมวดหมู่</label>
          <select id="category" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-blue-500">
            <option>คอมพิวเตอร์และไอที</option>
            <option>สมาร์ตโฟนและแท็บเล็ต</option>
            <option>เครื่องใช้ไฟฟ้า</option>
            <option>อุปกรณ์เกมมิ่ง</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Serial Number (S/N)</label>
        <input type="text" id="serial_number" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-blue-500">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">วันที่ซื้อ *</label>
          <input type="date" id="buy_date" required onchange="calcExpiry(1)" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">วันหมดประกัน *</label>
          <input type="date" id="expire_date" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-blue-500">
        </div>
      </div>
      <div class="flex gap-2">
        <button type="button" onclick="calcExpiry(1)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded">+1 ปี</button>
        <button type="button" onclick="calcExpiry(2)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded">+2 ปี</button>
        <button type="button" onclick="calcExpiry(3)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded">+3 ปี</button>
      </div>
      <button type="submit" class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg text-sm hover:bg-blue-700 transition mt-4">บันทึกข้อมูล</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth(true);

    function calcExpiry(years) {
      const buyDate = document.getElementById('buy_date').value;
      if (!buyDate) return;
      const d = new Date(buyDate);
      d.setFullYear(d.getFullYear() + years);
      document.getElementById('expire_date').value = d.toISOString().split('T')[0];
    }

    async function saveEquipment(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        brand: document.getElementById('brand').value,
        category: document.getElementById('category').value,
        serial_number: document.getElementById('serial_number').value,
        buy_date: document.getElementById('buy_date').value,
        expire_date: document.getElementById('expire_date').value
      };

      const res = await fetch(`${API_BASE}/equipments`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getToken()}`
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        window.location.href = 'index.html';
      } else {
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      }
    }
  </script>
</body>
</html>
